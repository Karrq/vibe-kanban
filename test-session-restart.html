<!DOCTYPE html>
<html>
<head>
    <title>Session Restart Detection Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .pass { background: #d4edda; border-color: #c3e6cb; }
        .fail { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Session Restart Detection Test</h1>
    
    <div id="results"></div>
    
    <script>
        // Simulate the session restart detection logic from Conversation.tsx
        function detectSessionRestarts(allProcessLogs, processes) {
            const restarts = new Set();
            
            allProcessLogs.forEach((log, index) => {
                // Skip the very first process - it doesn't restart anything
                if (index === 0) return;
                
                // Check if this is a new executor (not a follow-up)
                // Any executor after the first one indicates a task restart
                if (log.command === 'executor') {
                    restarts.add(String(log.id));
                    return;
                }
                
                // For follow-ups, check the restart_session flag in args
                if (log.command === 'followup_executor') {
                    // Try to get the process details from processes array
                    const processDetails = processes.find(p => p.id === String(log.id));
                    if (processDetails && processDetails.args) {
                        try {
                            const args = JSON.parse(processDetails.args);
                            // The args contains the restart_session flag
                            if (args && args.restart_session === true) {
                                restarts.add(String(log.id));
                            }
                        } catch (e) {
                            console.debug('Could not parse process args:', e);
                        }
                    }
                }
            });
            
            return restarts;
        }
        
        // Test cases
        const testCases = [
            {
                name: "First executor - NO banner",
                allProcessLogs: [
                    { id: '1', command: 'executor', status: 'completed' }
                ],
                processes: [
                    { id: '1', args: null }
                ],
                expected: new Set()
            },
            {
                name: "First executor + normal followup - NO banner for followup",
                allProcessLogs: [
                    { id: '1', command: 'executor', status: 'completed' },
                    { id: '2', command: 'followup_executor', status: 'completed' }
                ],
                processes: [
                    { id: '1', args: null },
                    { id: '2', args: JSON.stringify({ restart_session: false }) }
                ],
                expected: new Set()
            },
            {
                name: "First executor + restart followup - SHOW banner for restart",
                allProcessLogs: [
                    { id: '1', command: 'executor', status: 'completed' },
                    { id: '2', command: 'followup_executor', status: 'completed' }
                ],
                processes: [
                    { id: '1', args: null },
                    { id: '2', args: JSON.stringify({ restart_session: true }) }
                ],
                expected: new Set(['2'])
            },
            {
                name: "Two executors - SHOW banner for second executor",
                allProcessLogs: [
                    { id: '1', command: 'executor', status: 'completed' },
                    { id: '2', command: 'executor', status: 'completed' }
                ],
                processes: [
                    { id: '1', args: null },
                    { id: '2', args: null }
                ],
                expected: new Set(['2'])
            },
            {
                name: "Complex: executor + followups + new executor + followup",
                allProcessLogs: [
                    { id: '1', command: 'executor', status: 'completed' },
                    { id: '2', command: 'followup_executor', status: 'completed' },
                    { id: '3', command: 'followup_executor', status: 'completed' },
                    { id: '4', command: 'executor', status: 'completed' },
                    { id: '5', command: 'followup_executor', status: 'completed' }
                ],
                processes: [
                    { id: '1', args: null },
                    { id: '2', args: JSON.stringify({ restart_session: false }) },
                    { id: '3', args: JSON.stringify({ restart_session: true }) },
                    { id: '4', args: null },
                    { id: '5', args: JSON.stringify({ restart_session: false }) }
                ],
                expected: new Set(['3', '4'])  // Restart followup and second executor
            }
        ];
        
        // Run tests
        const results = document.getElementById('results');
        let allPassed = true;
        
        testCases.forEach((test, i) => {
            const result = detectSessionRestarts(test.allProcessLogs, test.processes);
            const passed = JSON.stringify([...result].sort()) === JSON.stringify([...test.expected].sort());
            
            if (!passed) allPassed = false;
            
            const div = document.createElement('div');
            div.className = 'test ' + (passed ? 'pass' : 'fail');
            div.innerHTML = `
                <h3>Test ${i + 1}: ${test.name}</h3>
                <p><strong>Result:</strong> ${passed ? '✓ PASSED' : '✗ FAILED'}</p>
                <pre>Expected: ${JSON.stringify([...test.expected].sort())}
Got:      ${JSON.stringify([...result].sort())}</pre>
                <details>
                    <summary>Test Data</summary>
                    <pre>${JSON.stringify(test, null, 2)}</pre>
                </details>
            `;
            results.appendChild(div);
        });
        
        // Summary
        const summary = document.createElement('div');
        summary.className = 'test ' + (allPassed ? 'info' : 'fail');
        summary.innerHTML = `<h2>Test Summary: ${allPassed ? 'All tests passed! ✓' : 'Some tests failed ✗'}</h2>`;
        results.insertBefore(summary, results.firstChild);
    </script>
</body>
</html>
